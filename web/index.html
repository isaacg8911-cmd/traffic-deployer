<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Deployer Map</title>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #e9e9e3; }
    #mapHud {
      position: absolute; right: 12px; bottom: 18px; z-index: 6;
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      width: 108px; pointer-events: none;
    }
    #mapHud > * { pointer-events: auto; }
    .hudBtn {
      padding: 8px 0; font: 700 13px system-ui, sans-serif;
      border: none; border-radius: 8px; cursor: pointer;
      background: #fff; color: #0f2744; box-shadow: 0 2px 8px rgba(0,0,0,.28);
    }
    .hudBtn:hover { background: #f1f5f9; }
    .hudBtn.primary { background: #1976d2; color: #fff; }
    .hudBtn.primary.off { background: #555; color: #fff; }
    .hudBtn.zoom { font-size: 18px; line-height: 1; padding: 6px 0; }
    .hudBtn.next { font-size: 11px; line-height: 1.2; padding: 8px 4px; }
    #confirm-pin-btn {
      display: none; font-size: 11px; line-height: 1.2; padding: 10px 6px;
      background: #e65100; color: #fff; border: none;
    }
    #confirm-pin-btn:hover { background: #bf360c; }
    #compass {
      width: 100%; border-radius: 10px;
      background: rgba(255,255,255,.96); box-shadow: 0 2px 8px rgba(0,0,0,.3);
      display: flex; flex-direction: column; align-items: center; padding: 6px 4px 4px;
      font-family: system-ui, sans-serif;
    }
    #compass-dial {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid #cfd8dc; position: relative;
      background: radial-gradient(circle at 50% 45%, #fafafa, #eceff1);
    }
    #compass-rose {
      position: absolute; inset: 0; font-size: 10px; font-weight: 800; color: #546e7a;
    }
    #compass-rose span { position: absolute; transform: translate(-50%, -50%); }
    #compass-rose .n { left: 50%; top: 8%; }
    #compass-rose .e { left: 92%; top: 50%; }
    #compass-rose .s { left: 50%; top: 92%; }
    #compass-rose .w { left: 8%; top: 50%; }
    #compass-needle {
      position: absolute; left: 50%; top: 50%; width: 3px; height: 28px;
      margin-left: -1.5px; margin-top: -24px; border-radius: 2px;
      background: linear-gradient(#e53935 0 55%, #1565ff 55% 100%);
      transform-origin: 50% 88%; transition: transform .25s ease-out;
    }
    #compass-readout { margin-top: 4px; font-size: 12px; font-weight: 800; color: #1f2430; }
    #compass-mode { font-size: 9px; font-weight: 600; color: #6b7280; text-align: center; line-height: 1.2; }
    #pick-banner {
      display: none; position: absolute; left: 50%; top: 14px; z-index: 8;
      transform: translateX(-50%); max-width: min(92%, 520px);
      padding: 12px 20px; border-radius: 12px;
      background: rgba(13, 71, 161, 0.94); color: #fff;
      font: 700 15px/1.35 system-ui, sans-serif; text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.35); pointer-events: none;
    }
    body.td-manual-grab #map { cursor: crosshair; }
    .site-ref-popup-wrap .maplibregl-popup-content {
      padding: 10px 12px; border-radius: 10px;
      font: 600 13px/1.35 system-ui, sans-serif; color: #0f2744;
      box-shadow: 0 4px 14px rgba(0,0,0,.22);
    }
    .site-ref-popup .site-ref-id { font-size: 15px; font-weight: 800; }
    .site-ref-popup .site-ref-street { margin-top: 4px; font-weight: 600; }
    .site-ref-popup .site-ref-side {
      margin-top: 6px; font-size: 11px; font-weight: 700;
      color: #546e7a; text-transform: uppercase; letter-spacing: .03em;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="pick-banner" aria-live="polite"></div>
  <div id="mapHud" aria-label="Map controls">
    <div id="compass" title="Heading when stopped (for install direction)">
      <div id="compass-dial">
        <div id="compass-rose"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span></div>
        <div id="compass-needle"></div>
      </div>
      <div id="compass-readout">—°</div>
      <div id="compass-mode">GPS compass</div>
    </div>
    <button type="button" id="confirm-pin-btn" class="hudBtn" title="Re-save orange pin after dragging">Re-save pin</button>
    <button type="button" id="zoom-in" class="hudBtn zoom" title="Zoom in">+</button>
    <button type="button" id="zoom-out" class="hudBtn zoom" title="Zoom out (works while Following)">−</button>
    <button type="button" id="next-site-btn" class="hudBtn next" title="Zoom to show you and the next stop">Next site</button>
    <button type="button" id="follow-btn" class="hudBtn primary">Follow Me</button>
  </div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./vendor/pmtiles.js"></script>
  <script src="./vendor/qwebchannel.js"></script>
  <script src="./style.js?v=19"></script>
  <script src="./app.js?v=27"></script>
</body>
</html>
