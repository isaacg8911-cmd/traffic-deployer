<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traffic Deployer Map</title>
  <link rel="stylesheet" href="./vendor/maplibre-gl.css" />
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #e9e9e3; }
    #follow-btn {
      position: absolute; right: 12px; bottom: 22px; z-index: 5;
      padding: 10px 14px; font: 600 14px system-ui, sans-serif;
      border: none; border-radius: 22px; cursor: pointer;
      background: #1976d2; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    #follow-btn.off { background: #555; }
    #navbar {
      position: absolute; left: 12px; right: 12px; top: 12px; z-index: 7;
      display: none; align-items: center; gap: 16px;
      padding: 14px 20px; border-radius: 14px;
      background: #1565ff; color: #fff;
      box-shadow: 0 4px 16px rgba(0,0,0,.4); font-family: system-ui, sans-serif;
    }
    #nav-arrow { font-size: 46px; line-height: 1; font-weight: 700; }
    #nav-textwrap { display: flex; flex-direction: column; }
    #nav-text { font-size: 24px; font-weight: 800; }
    #nav-sub { font-size: 15px; font-weight: 600; opacity: .9; margin-top: 2px; }
    #compass {
      position: absolute; top: 12px; right: 12px; z-index: 8;
      width: 108px; height: 128px; border-radius: 12px;
      background: rgba(255,255,255,.94); box-shadow: 0 2px 10px rgba(0,0,0,.35);
      display: flex; flex-direction: column; align-items: center; padding: 8px 6px 6px;
      font-family: system-ui, sans-serif; pointer-events: none;
    }
    #compass-dial {
      width: 84px; height: 84px; border-radius: 50%;
      border: 2px solid #cfd8dc; position: relative;
      background: radial-gradient(circle at 50% 45%, #fafafa, #eceff1);
    }
    #compass-rose {
      position: absolute; inset: 0; font-size: 11px; font-weight: 800; color: #546e7a;
    }
    #compass-rose span { position: absolute; transform: translate(-50%, -50%); }
    #compass-rose .n { left: 50%; top: 8%; }
    #compass-rose .e { left: 92%; top: 50%; }
    #compass-rose .s { left: 50%; top: 92%; }
    #compass-rose .w { left: 8%; top: 50%; }
    #compass-needle {
      position: absolute; left: 50%; top: 50%; width: 4px; height: 34px;
      margin-left: -2px; margin-top: -30px; border-radius: 2px;
      background: linear-gradient(#e53935 0 55%, #1565ff 55% 100%);
      transform-origin: 50% 88%; transition: transform .25s ease-out;
    }
    #compass-readout { margin-top: 6px; font-size: 13px; font-weight: 800; color: #1f2430; }
    #compass-mode { font-size: 10px; font-weight: 600; color: #6b7280; text-align: center; line-height: 1.2; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="compass" title="Heading when stopped (for install direction)">
    <div id="compass-dial">
      <div id="compass-rose"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span></div>
      <div id="compass-needle"></div>
    </div>
    <div id="compass-readout">—°</div>
    <div id="compass-mode">GPS compass</div>
  </div>
  <button id="follow-btn">Follow Me</button>
  <div id="navbar">
    <div id="nav-arrow">&#8593;</div>
    <div id="nav-textwrap">
      <div id="nav-text"></div>
      <div id="nav-sub"></div>
    </div>
  </div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script src="./vendor/pmtiles.js"></script>
  <script src="./vendor/qwebchannel.js"></script>
  <script src="./style.js?v=15"></script>
  <script src="./app.js?v=15"></script>
</body>
</html>
