# Render Blueprint — share-only hosted mobile PWA.
# Crew opens jobs via share link; job creation requires TD_MOBILE_ADMIN_KEY.
services:
  - type: web
    name: traffic-deployer-mobile
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    disk:
      name: tds-data
      mountPath: /app/tds_data
      sizeGB: 1
    envVars:
      - key: TD_MOBILE_PUBLIC
        value: "1"
      - key: TD_MOBILE_LINK_TTL_HOURS
        value: "16"
      - key: TD_MOBILE_ADMIN_KEY
        generateValue: true
      # Do NOT set TD_MOBILE_OPEN_CREATE here — hosted default is share-only.
