# Render Blueprint — self-serve hosted mobile PWA.
# Coworkers can import their own Excel/.EST files; each import creates a
# separate tokenized job/share link.
services:
  - type: web
    name: traffic-deployer-mobile
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    disk:
      name: tds-data
      mountPath: /app/tds_data
      sizeGB: 1
    envVars:
      - key: TD_MOBILE_PUBLIC
        value: "1"
      - key: TD_MOBILE_LINK_TTL_HOURS
        value: "16"
      - key: TD_MOBILE_OPEN_CREATE
        value: "1"
      - key: TD_MOBILE_ADMIN_KEY
        generateValue: true
