# Fly.io alternative host for the Traffic Deployer mobile PWA.
# https://fly.io  ->  install flyctl  ->  from the repo root:
#     fly launch --no-deploy --copy-config --name traffic-deployer-mobile
#     fly volume create tds_data --size 1
#     fly secrets set TD_MOBILE_ADMIN_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(18))")
#     fly deploy
#
# Notes:
#   - Fly builds the repo-root Dockerfile.
#   - The volume keeps job files across restarts (mounted at /app/tds_data).
#   - The public https URL is https://<app-name>.fly.dev — share links use it
#     automatically via --proxy-headers.
app = "traffic-deployer-mobile"
primary_region = "sjc"

[build]
  dockerfile = "../Dockerfile"

[env]
  TD_MOBILE_PUBLIC = "1"
  TD_MOBILE_LINK_TTL_HOURS = "16"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      method = "get"
      path = "/api/healthz"
      interval = "30s"
      timeout = "5s"

[mounts]
  source = "tds_data"
  destination = "/app/tds_data"
